<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Zephyr Launcher Preview</title>
		<link rel="stylesheet" href="/preview/css/zephyr.css" />
		<link rel="stylesheet" href="/preview/launcher.css" />
		<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
	</head>
	<body class="z-launcher" data-theme="dark">
		<div class="z-titlebar">
			<img src="/preview/logo.png" alt="Zephyr" class="z-titlebar-logo" />
			<span class="z-titlebar-title">Zephyr</span>
			<span class="z-titlebar-spacer"></span>
			<div class="z-titlebar-controls">
				<button class="z-titlebar-btn">—</button>
				<button class="z-titlebar-btn">▢</button>
				<button class="z-titlebar-btn">×</button>
			</div>
		</div>

		<div class="z-app-row">
			<aside class="z-sidebar">
				<div class="z-sidebar-game">
					<div class="z-sidebar-game-icon">
						<iconify-icon icon="mdi:gamepad-variant"></iconify-icon>
					</div>
					<span class="z-sidebar-game-label">Game</span>
				</div>

				<nav class="z-sidebar-nav" id="z-nav">
					<button class="z-nav-item" data-target="dashboard">
						<iconify-icon class="z-nav-icon" icon="mdi:view-dashboard"></iconify-icon>
						<span class="z-nav-label">Home</span>
					</button>
					<button class="z-nav-item" data-target="mods">
						<iconify-icon class="z-nav-icon" icon="mdi:package-variant"></iconify-icon>
						<span class="z-nav-label">Mods</span>
					</button>
					<button class="z-nav-item" data-target="browse">
						<iconify-icon class="z-nav-icon" icon="mdi:store-search"></iconify-icon>
						<span class="z-nav-label">Browse</span>
					</button>
					<button class="z-nav-item" data-target="profiles">
						<iconify-icon class="z-nav-icon" icon="mdi:account-group"></iconify-icon>
						<span class="z-nav-label">Profile</span>
					</button>
					<button class="z-nav-item" data-target="config">
						<iconify-icon class="z-nav-icon" icon="mdi:cog"></iconify-icon>
						<span class="z-nav-label">Config</span>
					</button>
					<button class="z-nav-item" data-target="plugins">
						<iconify-icon class="z-nav-icon" icon="mdi:puzzle"></iconify-icon>
						<span class="z-nav-label">Plugins</span>
					</button>
					<button class="z-nav-item active" data-target="settings">
						<iconify-icon class="z-nav-icon" icon="mdi:tune-vertical"></iconify-icon>
						<span class="z-nav-label">Settings</span>
						<span class="z-nav-indicator"></span>
					</button>
				</nav>

				<div class="z-sidebar-bottom">
					<button class="z-launch-btn" title="Play">
						<iconify-icon icon="mdi:play"></iconify-icon>
					</button>
					<div class="z-profile-pill">
						<iconify-icon icon="mdi:account"></iconify-icon>
					</div>
				</div>
			</aside>

			<main class="z-content" id="z-content">
				<!-- Page content injected by launcher.js -->
			</main>
		</div>

		<script src="/preview/launcher.js" type="module"></script>
	</body>
</html>
